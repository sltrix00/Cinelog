project_id = "cinelog"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://sltrix00.github.io/MovieTracker2/"
additional_redirect_urls = [
  "https://sltrix00.github.io/MovieTracker2/",
  "http://localhost:5173/",
  "https://localhost:5173/",
  "http://127.0.0.1:5173/",
]
jwt_expiry = 900
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

# To test Google Sign-In with local Supabase CLI, set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET
# in your local environment and uncomment the block below:
# [auth.external.google]
# enabled = true
# client_id = "<google-web-client-id>"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false

[functions.tmdb-proxy]
# Verification is performed inside the function via supabase.auth.getClaims() / getUser()
# so CORS OPTIONS preflight requests and custom error formatting work reliably.
verify_jwt = false
